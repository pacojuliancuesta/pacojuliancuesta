<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
<style>
  .h { font: 700 25px 'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #e6edf3; }
  .k { font: 600 13px 'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #f85149; letter-spacing: 1.2px; text-transform: uppercase; }
  .d { font: 400 16px 'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #c9d1d9; }
  .hl { font: 600 15px 'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #f85149; }
  .chip { font: 600 13px 'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #e6edf3; }
  .st { font: 700 12px 'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #d29922; letter-spacing: .6px; }
  .repo { font: 500 13px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace; fill: #8b949e; }
  .spin { animation: spin 3s linear infinite; transform-origin: 0 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .blip { animation: blip 1.6s ease-in-out infinite; }
  @keyframes blip { 50% { opacity: .2; } }
  .glow { animation: glow 3s ease-in-out infinite; }
  @keyframes glow { 50% { opacity: .35; } }
</style>
<defs>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f85149"/><stop offset="1" stop-color="#f85149" stop-opacity="0"/></linearGradient>
  <radialGradient id="gl" cx="0" cy="0" r="1"><stop offset="0" stop-color="#f85149" stop-opacity=".22"/><stop offset="1" stop-color="#f85149" stop-opacity="0"/></radialGradient>
  <clipPath id="r"><rect width="600" height="300" rx="16"/></clipPath>
</defs>
<g clip-path="url(#r)">
  <rect width="600" height="300" fill="#161b22"/>
  <circle cx="0" cy="0" r="260" fill="url(#gl)" class="glow"/>
  <rect width="600" height="4" fill="url(#bar)"/>
  <circle cx="62" cy="64" r="32" fill="#f85149" fill-opacity=".12" stroke="#f85149" stroke-opacity=".35"/>
  <g transform="translate(62 64)"><circle r="20" fill="none" stroke="#f85149" stroke-width="2"/><circle r="11" fill="none" stroke="#f85149" stroke-width="2"/>
      <circle r="3.5" fill="#f85149" class="blip"/><line x1="0" y1="-26" x2="0" y2="-15" stroke="#f85149" stroke-width="2"/><line x1="0" y1="15" x2="0" y2="26" stroke="#f85149" stroke-width="2"/>
      <line x1="-26" y1="0" x2="-15" y2="0" stroke="#f85149" stroke-width="2"/><line x1="15" y1="0" x2="26" y2="0" stroke="#f85149" stroke-width="2"/></g>
  <text x="112" y="56" class="k">Hacking web · OWASP</text>
  <text x="112" y="86" class="h">Web Hacking Lab</text>
  <rect x="475" y="28" width="93" height="24" rx="12" fill="#d29922" fill-opacity=".14" stroke="#d29922" stroke-opacity=".5"/>
  <text x="521.5" y="44.5" class="st" text-anchor="middle">EN CURSO</text>
  <text x="32" y="132" class="d">Laboratorio de hacking web con DVWA y PortSwigger</text>
  <text x="32" y="156" class="d">Web Security Academy: OWASP Top 10 documentado con</text>
  <text x="32" y="180" class="d">write-ups y payloads propios.</text>
  <text x="32" y="208" class="hl">▸ SQLi · XSS · CSRF · Command Injection · File Upload</text>
  <rect x="32" y="226" width="59" height="28" rx="14" fill="#f85149" fill-opacity=".14" stroke="#f85149" stroke-opacity=".45"/><text x="61.5" y="245" class="chip" text-anchor="middle">Kali</text>
  <rect x="99" y="226" width="110" height="28" rx="14" fill="#f85149" fill-opacity=".14" stroke="#f85149" stroke-opacity=".45"/><text x="154.0" y="245" class="chip" text-anchor="middle">Burp Suite</text>
  <rect x="217" y="226" width="59" height="28" rx="14" fill="#f85149" fill-opacity=".14" stroke="#f85149" stroke-opacity=".45"/><text x="246.5" y="245" class="chip" text-anchor="middle">DVWA</text>
  <rect x="284" y="226" width="68" height="28" rx="14" fill="#f85149" fill-opacity=".14" stroke="#f85149" stroke-opacity=".45"/><text x="318.0" y="245" class="chip" text-anchor="middle">OWASP</text>
  <text x="32" y="282" class="repo">github.com/pacojuliancuesta/web-hacking-lab  →</text>
</g>
<rect x=".5" y=".5" width="599" height="299" rx="16" fill="none" stroke="#30363d"/>
</svg>