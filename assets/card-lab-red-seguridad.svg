<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
<style>
  .h { font: 700 25px 'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #e6edf3; }
  .k { font: 600 13px 'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #3fb950; letter-spacing: 1.2px; text-transform: uppercase; }
  .d { font: 400 16px 'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #c9d1d9; }
  .hl { font: 600 15px 'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #3fb950; }
  .chip { font: 600 13px 'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #e6edf3; }
  .st { font: 700 12px 'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #3fb950; letter-spacing: .6px; }
  .repo { font: 500 13px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace; fill: #8b949e; }
  .spin { animation: spin 3s linear infinite; transform-origin: 0 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .blip { animation: blip 1.6s ease-in-out infinite; }
  @keyframes blip { 50% { opacity: .2; } }
  .glow { animation: glow 3s ease-in-out infinite; }
  @keyframes glow { 50% { opacity: .35; } }
</style>
<defs>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3fb950"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/></linearGradient>
  <radialGradient id="gl" cx="0" cy="0" r="1"><stop offset="0" stop-color="#3fb950" stop-opacity=".22"/><stop offset="1" stop-color="#3fb950" stop-opacity="0"/></radialGradient>
  <clipPath id="r"><rect width="600" height="300" rx="16"/></clipPath>
</defs>
<g clip-path="url(#r)">
  <rect width="600" height="300" fill="#161b22"/>
  <circle cx="0" cy="0" r="260" fill="url(#gl)" class="glow"/>
  <rect width="600" height="4" fill="url(#bar)"/>
  <circle cx="62" cy="64" r="32" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".35"/>
  <g transform="translate(62 64)"><path d="M0 -23 L19 -15 V0 C19 12 10 19 0 23 C-10 19 -19 12 -19 0 V-15 Z" fill="#3fb950" fill-opacity=".18" stroke="#3fb950" stroke-width="2.2"/>
      <path d="M-8 0 L-2 6 L9 -6" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="112" y="56" class="k">Hardening · Blue Team</text>
  <text x="112" y="86" class="h">Lab de Redes y Seguridad</text>
  <rect x="484" y="28" width="84" height="24" rx="12" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".5"/>
  <text x="526.0" y="44.5" class="st" text-anchor="middle">PÚBLICO</text>
  <text x="32" y="132" class="d">Red aislada en VirtualBox: Kali como atacante y Ubuntu</text>
  <text x="32" y="156" class="d">Server como objetivo. Escaneo, hardening del servidor</text>
  <text x="32" y="180" class="d">y comparación del antes y el después.</text>
  <text x="32" y="208" class="hl">▸ SSH reforzado · UFW · Fail2Ban · Nginx sin banners</text>
  <rect x="32" y="226" width="59" height="28" rx="14" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".45"/><text x="61.5" y="245" class="chip" text-anchor="middle">Kali</text>
  <rect x="99" y="226" width="76" height="28" rx="14" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".45"/><text x="137.0" y="245" class="chip" text-anchor="middle">Ubuntu</text>
  <rect x="183" y="226" width="59" height="28" rx="14" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".45"/><text x="212.5" y="245" class="chip" text-anchor="middle">Nmap</text>
  <rect x="250" y="226" width="93" height="28" rx="14" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".45"/><text x="296.5" y="245" class="chip" text-anchor="middle">Fail2Ban</text>
  <text x="32" y="282" class="repo">github.com/pacojuliancuesta/lab-red-seguridad  →</text>
</g>
<rect x=".5" y=".5" width="599" height="299" rx="16" fill="none" stroke="#30363d"/>
</svg>