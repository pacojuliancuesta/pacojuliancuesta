<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270">
<style>
  .yr { font: 700 14px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace; letter-spacing: 1px; }
  .tt { font: 700 17px 'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
  .sb { font: 400 14px 'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #8b949e; }
  .lg { font: 500 13px 'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #8b949e; }
  .pop { animation: pop .6s ease-out both; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .ring { animation: ring 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes ring { 0% { opacity: .6; transform: scale(1); } 100% { opacity: 0; transform: scale(2.3); } }
  .flow { animation: flow 1.2s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -16; } }
</style>
<defs>
