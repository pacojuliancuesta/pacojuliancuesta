<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
<style>
  .name { font: 700 58px 'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; letter-spacing: -0.5px; }
  .sub  { font: 500 24px 'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #9cc9ff; }
  .meta { font: 400 17px 'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #8b949e; }
  .tag  { font: 500 16px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace; fill: #8b949e; }
  .cmd  { font: 600 19px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace; fill: #3fb950; }
  .cursor { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .link { stroke: #39d0d8; stroke-width: 1.3; opacity: .25; animation: flash 4s ease-in-out infinite; }
  @keyframes flash { 0%,100% { opacity: .18; } 50% { opacity: .6; } }
  .halo { animation: pulse 3.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0% { opacity: .55; transform: scale(.4); } 100% { opacity: 0; transform: scale(2.2); } }
  .scan { animation: scan 6s linear infinite; }
  @keyframes scan { from { transform: translateY(-20px); } to { transform: translateY(360px); } }
  .fade { animation: fadein 1.2s ease-out both; }
  @keyframes fadein { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070b12"/><stop offset=".55" stop-color="#0d1f36"/><stop offset="1" stop-color="#123c66"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
  </pattern>
  <radialGradient id="glow" cx=".78" cy=".5" r=".45">
    <stop offset="0" stop-color="#2f81f7" stop-opacity=".35"/><stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="scanline" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#39d0d8" stop-opacity="0"/><stop offset=".5" stop-color="#39d0d8" stop-opacity=".5"/><stop offset="1" stop-color="#39d0d8" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2f81f7"/><stop offset="1" stop-color="#39d0d8"/>
  </linearGradient>
  <clipPath id="round"><rect width="1200" height="340" rx="18"/></clipPath>
</defs>
<g clip-path="url(#round)">
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>
  <line x1="820" y1="90" x2="930" y2="60" class="link" style="animation-delay:0.00s"/>
<line x1="930" y1="60" x2="1060" y2="105" class="link" style="animation-delay:0.25s"/>
<line x1="820" y1="90" x2="880" y2="175" class="link" style="animation-delay:0.50s"/>
<line x1="930" y1="60" x2="880" y2="175" class="link" style="animation-delay:0.75s"/>
<line x1="880" y1="175" x2="1000" y2="200" class="link" style="animation-delay:1.00s"/>
<line x1="1060" y1="105" x2="1000" y2="200" class="link" style="animation-delay:1.25s"/>
<line x1="1000" y1="200" x2="1120" y2="230" class="link" style="animation-delay:1.50s"/>
<line x1="880" y1="175" x2="790" y2="250" class="link" style="animation-delay:1.75s"/>
<line x1="790" y1="250" x2="940" y2="280" class="link" style="animation-delay:2.00s"/>
<line x1="1000" y1="200" x2="940" y2="280" class="link" style="animation-delay:2.25s"/>
<line x1="940" y1="280" x2="1080" y2="300" class="link" style="animation-delay:2.50s"/>
<line x1="1120" y1="230" x2="1080" y2="300" class="link" style="animation-delay:2.75s"/>
<line x1="1060" y1="105" x2="1120" y2="230" class="link" style="animation-delay:3.00s"/>
  <circle cx="820" cy="90" r="14" fill="#39d0d8" opacity="0" class="halo" style="animation-delay:0.0s"/><circle cx="820" cy="90" r="5" fill="#39d0d8"/>
<circle cx="930" cy="60" r="14" fill="#39d0d8" opacity="0" class="halo" style="animation-delay:0.4s"/><circle cx="930" cy="60" r="5" fill="#39d0d8"/>
<circle cx="1060" cy="105" r="14" fill="#39d0d8" opacity="0" class="halo" style="animation-delay:0.8s"/><circle cx="1060" cy="105" r="5" fill="#39d0d8"/>
<circle cx="880" cy="175" r="14" fill="#39d0d8" opacity="0" class="halo" style="animation-delay:1.2s"/><circle cx="880" cy="175" r="5" fill="#39d0d8"/>
<circle cx="1000" cy="200" r="14" fill="#f85149" opacity="0" class="halo" style="animation-delay:1.6s"/><circle cx="1000" cy="200" r="5" fill="#f85149"/>
<circle cx="1120" cy="230" r="14" fill="#39d0d8" opacity="0" class="halo" style="animation-delay:2.0s"/><circle cx="1120" cy="230" r="5" fill="#39d0d8"/>
<circle cx="790" cy="250" r="14" fill="#39d0d8" opacity="0" class="halo" style="animation-delay:2.4s"/><circle cx="790" cy="250" r="5" fill="#39d0d8"/>
<circle cx="940" cy="280" r="14" fill="#39d0d8" opacity="0" class="halo" style="animation-delay:2.8s"/><circle cx="940" cy="280" r="5" fill="#39d0d8"/>
<circle cx="1080" cy="300" r="14" fill="#39d0d8" opacity="0" class="halo" style="animation-delay:3.2s"/><circle cx="1080" cy="300" r="5" fill="#39d0d8"/>
  <rect class="scan" x="0" y="0" width="1200" height="2" fill="url(#scanline)"/>
  <g>
    <text x="64" y="82" class="tag">~/paco $ cat perfil</text>
    <text x="64" y="150" class="name">Francisco Julián Cuesta</text>
    <rect x="66" y="170" width="140" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="64" y="216" class="sub">Estudiante de 2º de ASIR · Ciberseguridad</text>
    <text x="64" y="248" class="meta">Madrid, España  ·  Pentesting · SOC · Hardening · Análisis de logs</text>
    <text x="64" y="298" class="cmd">&gt; buscando FCT · marzo 2027<tspan class="cursor"> █</tspan></text>
  </g>
</g>
<rect x=".5" y=".5" width="1199" height="339" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>