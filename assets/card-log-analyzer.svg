<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
<style>
  .h { font: 700 25px 'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #e6edf3; }
  .k { font: 600 13px 'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #39d0d8; letter-spacing: 1.2px; text-transform: uppercase; }
  .d { font: 400 16px 'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #c9d1d9; }
  .hl { font: 600 15px 'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #39d0d8; }
  .chip { font: 600 13px 'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #e6edf3; }
  .st { font: 700 12px 'Segoe UI', Ubuntu, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #3fb950; letter-spacing: .6px; }
  .repo { font: 500 13px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace; fill: #8b949e; }
  .spin { animation: spin 3s linear infinite; transform-origin: 0 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .blip { animation: blip 1.6s ease-in-out infinite; }
  @keyframes blip { 50% { opacity: .2; } }
  .glow { animation: glow 3s ease-in-out infinite; }
  @keyframes glow { 50% { opacity: .35; } }
</style>
<defs>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#39d0d8"/><stop offset="1" stop-color="#39d0d8" stop-opacity="0"/></linearGradient>
  <radialGradient id="gl" cx="0" cy="0" r="1"><stop offset="0" stop-color="#39d0d8" stop-opacity=".22"/><stop offset="1" stop-color="#39d0d8" stop-opacity="0"/></radialGradient>
  <clipPath id="r"><rect width="600" height="300" rx="16"/></clipPath>
</defs>
<g clip-path="url(#r)">
  <rect width="600" height="300" fill="#161b22"/>
  <circle cx="0" cy="0" r="260" fill="url(#gl)" class="glow"/>
  <rect width="600" height="4" fill="url(#bar)"/>
  <circle cx="62" cy="64" r="32" fill="#39d0d8" fill-opacity=".12" stroke="#39d0d8" stroke-opacity=".35"/>
  <g transform="translate(62 64)"><rect x="-16" y="-21" width="26" height="34" rx="4" fill="none" stroke="#39d0d8" stroke-width="2"/>
      <line x1="-10" y1="-12" x2="4" y2="-12" stroke="#39d0d8" stroke-width="2"/><line x1="-10" y1="-5" x2="4" y2="-5" stroke="#f85149" stroke-width="2" class="blip"/><line x1="-10" y1="2" x2="0" y2="2" stroke="#39d0d8" stroke-width="2"/>
      <circle cx="9" cy="10" r="8" fill="#161b22" stroke="#39d0d8" stroke-width="2.4"/><line x1="15" y1="16" x2="21" y2="22" stroke="#39d0d8" stroke-width="3" stroke-linecap="round"/></g>
  <text x="112" y="56" class="k">Detección · SOC</text>
  <text x="112" y="86" class="h">Log Security Analyzer</text>
  <rect x="484" y="28" width="84" height="24" rx="12" fill="#3fb950" fill-opacity=".14" stroke="#3fb950" stroke-opacity=".5"/>
  <text x="526.0" y="44.5" class="st" text-anchor="middle">PÚBLICO</text>
  <text x="32" y="132" class="d">Analiza auth.log y syslog para detectar 6 patrones de</text>
  <text x="32" y="156" class="d">ataque: fuerza bruta SSH, usuarios inválidos y escalada</text>
  <text x="32" y="180" class="d">con sudo/su. Perfila IPs atacantes y exporta HTML/JSON.</text>
  <text x="32" y="208" class="hl">▸ Clasificación por severidad: crítico → info</text>
  <rect x="32" y="226" width="76" height="28" rx="14" fill="#39d0d8" fill-opacity=".14" stroke="#39d0d8" stroke-opacity=".45"/><text x="70.0" y="245" class="chip" text-anchor="middle">Python</text>
  <rect x="116" y="226" width="68" height="28" rx="14" fill="#39d0d8" fill-opacity=".14" stroke="#39d0d8" stroke-opacity=".45"/><text x="150.0" y="245" class="chip" text-anchor="middle">Regex</text>
  <rect x="192" y="226" width="76" height="28" rx="14" fill="#39d0d8" fill-opacity=".14" stroke="#39d0d8" stroke-opacity=".45"/><text x="230.0" y="245" class="chip" text-anchor="middle">Jinja2</text>
  <rect x="276" y="226" width="93" height="28" rx="14" fill="#39d0d8" fill-opacity=".14" stroke="#39d0d8" stroke-opacity=".45"/><text x="322.5" y="245" class="chip" text-anchor="middle">Chart.js</text>
  <text x="32" y="282" class="repo">github.com/pacojuliancuesta/log-analyzer  →</text>
</g>
<rect x=".5" y=".5" width="599" height="299" rx="16" fill="none" stroke="#30363d"/>
</svg>